; em2coop: local co-op for Disney Epic Mickey 2. Put next to binkw32.dll.
[coop]
; 0 = player 2 presses the join button to join and again to leave
; 1 = player 2 joins automatically when a second controller is connected
auto_join=0

; Button on player 2's controller that joins/leaves (XInput mask): 
; 16 = Start, 32 = Back, 0 = none
join_button=16

; 1 = vertical split screen for two players
; 0 = shared screen
split_screen=1

; 1 = level scripts switch the split off/on around transitions
; 0 = keep the split on whenever two players are in
follow_script_split=1
